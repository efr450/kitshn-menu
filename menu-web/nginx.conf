# Tailscale strips the /shop prefix before requests arrive here.
server {
    listen 80;
    root /usr/share/nginx/html;
    # always revalidate, so a changed file shows on the next load (the service worker keeps offline copies)
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    # the page shares Tandoor's address and sign-in: allow only its own files and Tandoor's API
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location / {
        try_files $uri $uri/ =404;
    }
    # Menu fork: the tablet's Menu app reaches the Add recipe page on the LAN port (compose.yaml), where
    # nothing strips /shop; drop it here so the same paths work both ways.
    location /shop/ {
        rewrite ^/shop(/.*)$ $1 last;
    }
    # Menu fork: the Add recipe page shows each recipe's own photo, from the recipe's site (https only).
    # A location with add_header drops the server's, so they are repeated.
    location /add/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    # Menu fork: the recipe inbox server (Menu repo, importer/menu_import/inbox.py) on the host's loopback.
    # It checks the Tandoor session itself, so the browser's cookies pass through.
    location /api/inbox/ {
        proxy_pass http://host.docker.internal:8091;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
