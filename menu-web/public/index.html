<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17140c">
  <title>Shopping</title>
  <link rel="manifest" href="/shop/manifest.json">
  <link rel="icon" href="/shop/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shop/app.css">
  <script type="module" src="/shop/app.js"></script>
</head>
<body>
  <header class="top" id="top">
    <h1>Shopping</h1>
    <button class="pill" id="pill" type="button" title="Refresh now">Loading…</button>
    <button class="more" id="more" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">⋯</button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitemcheckbox" id="hide" aria-checked="false"><span>Hide checked items<small id="hide-why">ticked items stay, crossed out</small></span><span class="switch" aria-hidden="true"></span></button>
      <button type="button" role="menuitem" id="clear">Clear checked<small>take ticked items off the list</small></button>
      <button type="button" role="menuitem" id="refresh">Refresh now<small>pull the latest list from home</small></button>
    </div>
    <div class="add">
      <div class="field">
        <input id="add-in" type="text" placeholder="Add: 2 lb chicken thighs, a dozen eggs…" autocomplete="off" autocapitalize="none" enterkeyhint="done" aria-label="Add an item">
        <span class="amt-tag" id="add-amt" hidden></span>
      </div>
      <div class="sug" id="add-sug" hidden></div>
    </div>
    <div class="rchips" id="srcs" role="toolbar" aria-label="Show one recipe's items" hidden></div>
  </header>
  <p class="note" id="note" hidden></p>
  <main id="list"></main>
  <p class="toast" id="toast" role="status" hidden></p>
</body>
</html>
