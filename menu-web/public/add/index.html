<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17140c">
  <title>Add/Monitor Recipe</title>
  <link rel="manifest" href="/shop/manifest.json">
  <link rel="icon" href="/shop/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shop/app.css">
  <link rel="stylesheet" href="/shop/add/add.css">
  <script type="module" src="/shop/add/add.js"></script>
</head>
<body>
  <header class="top">
    <h1>Add/Monitor Recipe</h1>
    <button class="pill" id="bell" type="button" hidden>🔔 Notify me</button>
    <a class="pill link" href="/shop/">Shopping</a>
    <form class="paste" id="paste">
      <textarea id="link" rows="1" maxlength="20000" placeholder="Paste a link, or type your own recipe" autocomplete="off" aria-label="Recipe link or your own recipe"></textarea>
      <button class="go" type="submit">Add</button>
    </form>
    <p class="tip">✍️ Or type a recipe of your own, like “Sweet potato hash: 2 sweet potatoes, an onion, 4 eggs, fry till crisp”. Claude writes it up and asks about anything missing.</p>
  </header>
  <p class="note" id="note" hidden></p>
  <main id="jobs"></main>
  <div id="layer"></div>
  <p class="toast" id="toast" role="status" hidden></p>
</body>
</html>
